name: 功能建议
description: 提出新能力、改进点或体验优化
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的问题**，再描述期望的方案。这样更容易判断它是否属于本项目
        的定位（本机、私有、Windows AIPC 优先的本地 RAG）。

        以下内容明确不在当前范围内：OCR / ASR 解析、把语料或向量上传到云端、
        非本地推理后端、发布到 PyPI。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索过既有 Issue 与 CHANGELOG，确认不是重复建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么不便？现在的做法为什么不够用？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如果涉及 CLI 或 MCP 工具，请给出设想的调用方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 新增 MCP 工具
        - 现有 MCP 工具参数/返回结构调整
        - CLI 命令
        - 文档 / 仓库结构
        - 性能（延迟、显存、冷启动）
        - 设备调度（NPU / iGPU / CPU）
        - 文档解析与切分
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: 兼容性
      options:
        - label: 该方案会改变既有 CLI / MCP 工具的可见行为（属于破坏性变更）
          required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考资料、相关项目、原型代码或截图。
    validations:
      required: false
