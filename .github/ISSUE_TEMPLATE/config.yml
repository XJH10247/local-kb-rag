# GitHub Issue 模板选择页的配置。
#
# ⚠️ 下游部署者注意（Clone 后必读）：
#   GitHub 对本文件 contact_links.url 有硬性校验——只接受绝对 URL（http/https），
#   不支持相对路径，也不支持 ${{ }} 之类表达式。因此这里**无法动态获取仓库地址**，
#   必须按你 fork/部署后的实际地址手工替换下方 3 处 <OWNER>/<REPO>。
#   替换方法：
#     - 在 GitHub 仓库页复制地址（形如 https://github.com/你的用户名/仓库名）
#     - 把 3 处 https://github.com/<OWNER>/<REPO> 整体替换为该地址
#   若暂不替换：仅导致 Issue 选择页 3 个引导链接 404，不影响代码、安装与运行。
#   也可直接删除整个 contact_links 段落，让页面只保留 Issue 模板。

blank_issues_enabled: false
contact_links:
  - name: 安全漏洞报告
    url: https://github.com/<OWNER>/<REPO>/security/advisories/new
    about: 请勿用公开 Issue 报告安全问题，改用私下的漏洞报告渠道（详见 SECURITY.md）。
  - name: 使用与安装问题
    url: https://github.com/<OWNER>/<REPO>/blob/main/README.md
    about: 安装失败、设备不可用、模型下载等常见问题，README 的「故障排查」已有说明。
  - name: 参与贡献前请先阅读
    url: https://github.com/<OWNER>/<REPO>/blob/main/CONTRIBUTING.md
    about: 命名约定、Skill 包自包含要求、本地检查命令与 PR 期望。
