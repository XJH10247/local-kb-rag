# Repository = "<REPO_URL>"
# Issues = "<REPO_URL>/issues"
# Changelog = "<REPO_URL>/blob/main/CHANGELOG.md"
#
# 说明：本项目不作为 Python 包分发（无 pip install），[project.urls] 缺失
#       不影响任何功能，也不会被 CI 校验为错误。
